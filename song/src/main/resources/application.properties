spring.application.name=song

# ==========================================
# DATASOURCE CONFIGURATION (Render & Local)
# ==========================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_song}?sslmode=${DB_SSL_MODE:disable}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# SERVER PORT (Render passes PORT)
# ==========================================
server.port=${PORT:8080}

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
# Automatically creates/updates the database schema
spring.jpa.hibernate.ddl-auto=update

# Optimizes the SQL generation specifically for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true