services:
  # ── Backend (Docker) ─────────────────────────────────────────────────────────
  - type: web
    name: youtube-backend
    env: docker
    plan: free
    dockerfilePath: ./song/Dockerfile
    dockerContext: ./song
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: youtube-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: youtube-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: youtube-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: youtube-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: youtube-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: DB_SSL_MODE
        value: require
      - key: PORT
        value: "8080"

  # ── Frontend (Static) ────────────────────────────────────────────────────────
  - type: web
    name: youtube-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://youtube-backend-6u09.onrender.com

databases:
  - name: youtube-db
    plan: free
    databaseName: db_song
